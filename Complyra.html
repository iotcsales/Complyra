<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complyra — AI Compliance Operating System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#131A2B;
    --ink-soft:#3C4560;
    --ink-faint:#8990A6;
    --paper:#EEF0F3;
    --paper-raised:#FFFFFF;
    --line:#D2D6DE;
    --line-strong:#AEB4C2;
    --brass:#A9824F;
    --brass-dark:#7C5E36;
    --brass-tint:#F1E7D6;
    --critical:#AE372F;
    --critical-tint:#F7E4E2;
    --action:#B4691F;
    --action-tint:#F7E9D6;
    --upcoming:#93761B;
    --upcoming-tint:#F3EED2;
    --compliant:#3C7350;
    --compliant-tint:#DFEBE3;
    --mismatch:#7A4EA6;
    --mismatch-tint:#EBE1F4;
    --na:#767E8D;
    --na-tint:#E7E9ED;
    --shadow: 0 1px 2px rgba(19,26,43,0.06), 0 8px 24px -12px rgba(19,26,43,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces', serif;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  .mono{font-family:'IBM Plex Mono', monospace; letter-spacing:0.02em;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  textarea{font-family:inherit;}

  #app-shell{display:flex; min-height:100vh;}
  .railnav{
    width:230px; flex-shrink:0; background:var(--ink); color:#DCE0EA;
    display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  }
  .railnav-brand{padding:24px 22px 16px 22px; border-bottom:1px solid rgba(255,255,255,0.1);}
  .railnav-brand .mark{font-family:'Fraunces', serif; font-weight:700; font-size:20px; color:#fff; letter-spacing:0.02em;}
  .railnav-brand .sub{font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--brass); margin-top:4px;}
  .railnav-tabs{flex:1; padding:8px 0; overflow-y:auto;}
  .railtab{display:flex; align-items:center; gap:9px; padding:10px 22px; font-size:12.5px; color:#AEB6CC; border-left:3px solid transparent; cursor:pointer; transition:background .15s ease;}
  .railtab .idx{font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--brass); width:18px;}
  .railtab.disabled{opacity:0.35; cursor:not-allowed;}
  .railtab.active{background:rgba(255,255,255,0.06); color:#fff; border-left-color:var(--brass);}
  .railtab:not(.disabled):not(.active):hover{background:rgba(255,255,255,0.04); color:#fff;}
  .railnav-foot{padding:14px 22px 20px 22px; border-top:1px solid rgba(255,255,255,0.1); font-size:10px; line-height:1.5; color:#8089A0;}

  main{flex:1; min-width:0; padding:40px 52px 80px 52px; max-width:1000px;}
  @media (max-width: 900px){
    #app-shell{flex-direction:column;}
    .railnav{width:100%; height:auto; position:relative; flex-direction:row; overflow-x:auto;}
    .railnav-brand{border-bottom:none; border-right:1px solid rgba(255,255,255,0.1); flex-shrink:0;}
    .railnav-tabs{display:flex; padding:0;}
    .railtab{border-left:none; border-bottom:3px solid transparent; white-space:nowrap;}
    .railtab.active{border-left:none; border-bottom-color:var(--brass);}
    .railnav-foot{display:none;}
    main{padding:26px 18px 60px 18px;}
  }

  .eyebrow{font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--brass-dark); margin-bottom:10px;}
  .lede{color:var(--ink-soft); font-size:15px; line-height:1.6; max-width:660px; margin:8px 0 26px 0;}
  .btn{display:inline-flex; align-items:center; gap:8px; background:var(--ink); color:#fff; border:none; padding:11px 18px; font-size:13.5px; font-weight:600; border-radius:3px;}
  .btn:hover{background:#232D48;}
  .btn.secondary{background:transparent; color:var(--ink); border:1px solid var(--line-strong);}
  .btn.secondary:hover{border-color:var(--ink);}
  .btn.small{padding:7px 12px; font-size:12px;}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}
  .btn-row{display:flex; gap:8px; flex-wrap:wrap;}

  .stamp{display:inline-flex; flex-direction:column; align-items:center; justify-content:center; border:1.5px solid var(--brass); color:var(--brass-dark); border-radius:50%; width:94px; height:94px; transform:rotate(-8deg); font-family:'IBM Plex Mono', monospace; text-align:center; line-height:1.25; padding:6px; flex-shrink:0;}
  .stamp .t1{font-size:9px; letter-spacing:0.06em; text-transform:uppercase;}
  .stamp .t2{font-size:12px; font-weight:600; letter-spacing:0.03em; margin:2px 0;}
  .stamp .t3{font-size:8px; letter-spacing:0.05em;}

  .welcome-hero{display:flex; align-items:flex-start; gap:36px; padding:8px 0 36px 0; border-bottom:1px solid var(--line); margin-bottom:32px;}
  .welcome-hero h1{font-size:37px; line-height:1.1; margin:0 0 12px 0; max-width:540px;}
  .flow-strip{display:flex; flex-wrap:wrap; margin:26px 0 8px 0; border:1px solid var(--line); border-radius:4px; overflow:hidden;}
  .flow-strip .step{flex:1; min-width:110px; padding:11px 13px; border-right:1px solid var(--line); background:var(--paper-raised); font-size:11px;}
  .flow-strip .step:last-child{border-right:none;}
  .flow-strip .step .n{font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--brass); display:block; margin-bottom:3px;}
  .jur-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:26px;}
  .jur-card{background:var(--paper-raised); border:1px solid var(--line); border-radius:4px; padding:15px 16px 13px 16px;}
  .jur-card .code{font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--brass-dark); font-weight:600;}
  .jur-card .name{font-family:'Fraunces', serif; font-size:16px; margin:4px 0 6px 0;}
  .jur-card .shape{font-size:11.5px; color:var(--ink-soft); line-height:1.5;}
  @media (max-width:700px){.jur-grid{grid-template-columns:1fr;}}

  .qblock{margin-bottom:24px; max-width:600px; padding-bottom:20px; border-bottom:1px solid var(--line);}
  .qblock label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:8px; text-transform:uppercase; letter-spacing:0.03em;}
  .option-row{display:flex; flex-wrap:wrap; gap:8px;}
  .option-btn{padding:9px 15px; border:1px solid var(--line-strong); border-radius:3px; background:var(--paper-raised); font-size:13px; color:var(--ink);}
  .option-btn:hover{border-color:var(--ink);}
  .option-btn.selected{background:var(--ink); border-color:var(--ink); color:#fff;}
  .field-hint{font-size:11.5px; color:var(--ink-faint); margin-top:6px;}
  .text-input{width:100%; max-width:400px; padding:9px 12px; border:1px solid var(--line-strong); border-radius:3px; font-size:13.5px; font-family:inherit; color:var(--ink);}
  .text-input:focus{outline:2px solid var(--brass); outline-offset:1px;}

  .status-summary{display:flex; gap:9px; flex-wrap:wrap; margin:16px 0 26px 0;}
  .vault-summary{display:flex; gap:9px; flex-wrap:wrap; margin:16px 0 26px 0;}
  .chip{display:flex; align-items:center; gap:7px; padding:7px 11px; border-radius:3px; font-size:12px; font-weight:600; border:1px solid var(--line); background:var(--paper-raised);}
  .dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .dot.critical{background:var(--critical);} .dot.action_required{background:var(--action);}
  .dot.upcoming{background:var(--upcoming);} .dot.good_practice{background:var(--compliant);}
  .dot.mismatch{background:var(--mismatch);} .dot.na{background:var(--na);}

  .req-group-title{display:flex; align-items:center; gap:9px; font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; margin:30px 0 12px 0; color:var(--ink-soft);}
  .req-card{position:relative; background:var(--paper-raised); border:1px solid var(--line); border-left:4px solid var(--na); border-radius:3px; padding:19px 21px; margin-bottom:13px; box-shadow:var(--shadow);}
  .req-card.critical{border-left-color:var(--critical);}
  .req-card.action_required{border-left-color:var(--action);}
  .req-card.upcoming{border-left-color:var(--upcoming);}
  .req-card.good_practice{border-left-color:var(--compliant);}
  .req-name{font-family:'Fraunces', serif; font-size:18px; margin:0 0 4px 0;}
  .req-meta{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:4px;}
  .tag{font-family:'IBM Plex Mono', monospace; font-size:9.5px; letter-spacing:0.03em; padding:2px 7px; border-radius:2px; text-transform:uppercase; color:#fff;}
  .tag.critical{background:var(--critical);} .tag.action_required{background:var(--action);}
  .tag.upcoming{background:var(--upcoming);} .tag.good_practice{background:var(--compliant);}
  .tag.mismatch{background:var(--mismatch);}
  .tag.outline{background:transparent; border:1px solid var(--line-strong); color:var(--ink-soft); text-transform:none; font-size:10.5px;}
  .tag.brass{background:var(--brass); color:#fff;}
  .req-why{font-size:13px; color:var(--ink-soft); line-height:1.55; margin:11px 0;}
  .req-block{margin-top:11px;}
  .req-block .label{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); margin-bottom:5px;}
  .req-block ul, .req-block ol{margin:0; padding-left:18px; font-size:12.5px; color:var(--ink); line-height:1.6;}
  .req-block p{margin:0; font-size:12.5px; color:var(--ink); line-height:1.6;}
  .req-footer{display:flex; justify-content:space-between; align-items:center; margin-top:14px; padding-top:11px; border-top:1px solid var(--line); font-size:11px; color:var(--ink-faint); flex-wrap:wrap; gap:8px;}
  .confidence{font-family:'IBM Plex Mono', monospace; padding:3px 8px; border-radius:2px; font-size:9.5px; text-transform:uppercase;}
  .confidence.requires_verification{background:var(--critical-tint); color:var(--critical);}
  .confidence.medium{background:var(--action-tint); color:var(--action);}
  .confidence.high{background:var(--compliant-tint); color:var(--compliant);}

  .verify-block{margin-top:13px; background:var(--paper); border:1px solid var(--line); border-radius:3px; padding:12px 14px;}
  .verify-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:6px 18px; font-size:11.5px;}
  .verify-grid .k{color:var(--ink-faint); text-transform:uppercase; font-size:9.5px; letter-spacing:0.04em; margin-bottom:1px;}
  .verify-grid .v{color:var(--ink);}
  .source-link{margin-top:8px; font-size:11px; color:var(--ink-faint); font-style:italic;}

  /* Document intelligence */
  .doc-card{background:var(--paper-raised); border:1px solid var(--line); border-radius:3px; padding:17px 20px; margin-bottom:12px;}
  .doc-card-head{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap;}
  .doc-status-badge{font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase; padding:4px 9px; border-radius:2px; font-weight:600; white-space:nowrap;}
  .doc-status-badge.MISSING{background:var(--na-tint); color:var(--na);}
  .doc-status-badge.MATCHED{background:var(--compliant-tint); color:var(--compliant);}
  .doc-status-badge.EXPIRING{background:var(--upcoming-tint); color:var(--upcoming);}
  .doc-status-badge.EXPIRED{background:var(--critical-tint); color:var(--critical);}
  .doc-status-badge.MISMATCH{background:var(--mismatch-tint); color:var(--mismatch);}
  .doc-status-badge.INCOMPLETE{background:var(--action-tint); color:var(--action);}
  .doc-status-badge.REQUIRES_REVIEW{background:var(--action-tint); color:var(--action);}
  .upload-zone{margin-top:13px; padding:14px; background:var(--paper); border:1px dashed var(--line-strong); border-radius:3px;}
  .upload-zone textarea{width:100%; min-height:56px; border:1px solid var(--line-strong); border-radius:3px; padding:9px 10px; font-size:12.5px; resize:vertical; margin-bottom:10px;}
  .scenario-row{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:6px;}
  .scenario-btn{font-size:11.5px; padding:7px 11px; border:1px solid var(--line-strong); border-radius:3px; background:#fff;}
  .scenario-btn:hover{border-color:var(--ink);}
  .extract-panel{margin-top:13px; background:var(--paper); border:1px solid var(--line); border-radius:3px; padding:14px 16px;}
  .extract-flag{font-family:'IBM Plex Mono', monospace; font-size:9.5px; text-transform:uppercase; letter-spacing:0.04em; color:var(--brass-dark); background:var(--brass-tint); display:inline-block; padding:2px 7px; border-radius:2px; margin-bottom:9px;}
  .extract-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px 20px; font-size:12px;}
  .extract-grid .k{font-size:9.5px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint); margin-bottom:1px;}
  .extract-grid .v{color:var(--ink); font-weight:500;}
  .system-msg{margin-top:11px; font-size:12.5px; color:var(--ink-soft); font-style:italic; padding-top:10px; border-top:1px solid var(--line);}
  .ambiguity-note{margin-top:10px; font-size:11.5px; color:var(--action); background:var(--action-tint); border-radius:3px; padding:8px 10px;}
  .notice-banner{background:var(--brass-tint); border:1px solid var(--brass); color:var(--brass-dark); border-radius:3px; padding:12px 16px; font-size:13px; margin-bottom:22px; max-width:640px; line-height:1.5;}
  .glossary-term{border-bottom:1px dotted var(--brass); cursor:help; text-decoration:none; font-weight:600;}
  .notes-block{margin-top:14px; border-top:1px solid var(--line); padding-top:12px;}
  .notes-block textarea{width:100%; min-height:50px; border:1px solid var(--line-strong); border-radius:3px; padding:8px 10px; font-size:12.5px; font-family:inherit; resize:vertical;}
  .trend-chart-wrap{margin:20px 0 28px 0; background:var(--paper-raised); border:1px solid var(--line); border-radius:4px; padding:18px 20px;}
  .custom-reminder-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:8px; padding:10px 14px; border:1px solid var(--line); border-radius:3px; background:var(--paper-raised);}

  /* Gap / calendar / dashboard */
  .gap-list-title{font-family:'IBM Plex Mono', monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; margin:26px 0 11px 0; display:flex; align-items:center; gap:8px;}
  .gap-item{display:flex; justify-content:space-between; gap:12px; padding:11px 15px; border:1px solid var(--line); border-radius:3px; background:var(--paper-raised); margin-bottom:7px; font-size:13px;}
  .gap-item .status-label{font-size:11px; color:var(--ink-faint);}
  .score-panel{display:flex; align-items:center; gap:26px; background:var(--paper-raised); border:1px solid var(--line); border-radius:4px; padding:24px 28px; margin-bottom:24px; flex-wrap:wrap;}
  .score-ring{width:100px; height:100px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; flex-shrink:0; font-family:'Fraunces', serif; font-weight:600; border:8px solid var(--line); line-height:1.1;}
  .gap-category-explainer{font-size:11.5px; color:var(--ink-faint); margin:-4px 0 10px 0; max-width:600px; line-height:1.4;}
  .score-label{font-size:12.5px; color:var(--ink-soft); font-weight:600; margin-bottom:4px;}
  .score-note{font-size:11.5px; color:var(--ink-faint); max-width:440px; line-height:1.5;}
  .score-explainer{font-size:11px; color:var(--ink-faint); max-width:460px; line-height:1.5; margin-top:9px; padding-top:9px; border-top:1px solid var(--line);}

  .metric-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:13px; margin-bottom:30px;}
  .health-banner{display:flex; align-items:center; gap:14px; border:1px solid; border-radius:4px; padding:16px 20px; margin-bottom:26px;}
  .health-dot{width:14px; height:14px; border-radius:50%; flex-shrink:0;}
  .health-level{font-family:'Fraunces', serif; font-size:18px; font-weight:600;}
  .health-sub{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .change-row{font-size:13px; padding:9px 0; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .review-dates-row{display:flex; gap:32px; margin:24px 0 6px 0; flex-wrap:wrap;}
  .review-dates-row .k{font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint); margin-bottom:3px;}
  .review-dates-row .v{font-family:'Fraunces', serif; font-size:16px;}
  .metric-card{background:var(--paper-raised); border:1px solid var(--line); border-radius:4px; padding:16px 18px;}
  .metric-card .val{font-family:'Fraunces', serif; font-size:29px;}
  .metric-card .lbl{font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.04em; margin-top:4px;}
  @media (max-width:700px){.metric-grid{grid-template-columns:repeat(2,1fr);}}

  .cal-bucket{margin-bottom:24px;}
  .cal-bucket-head{display:flex; align-items:center; gap:9px; font-family:'IBM Plex Mono', monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid var(--line);}
  .cal-item{display:flex; flex-direction:column; gap:8px; padding:11px 15px; border:1px solid var(--line); border-left:3px solid var(--brass); border-radius:3px; background:var(--paper-raised); margin-bottom:7px; font-size:13px;}
  .cal-item > div:first-child{display:flex; justify-content:space-between; gap:12px;}
  .cal-item-actions{display:flex; gap:7px; flex-wrap:wrap;}
  .cal-item .date{font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-faint); white-space:nowrap;}

  /* Action plan */
  .plan-item{background:var(--paper-raised); border:1px solid var(--line); border-left:4px solid var(--ink); border-radius:3px; padding:18px 22px; margin-bottom:12px;}
  .plan-head{display:flex; gap:14px; align-items:flex-start;}
  .plan-rank{font-family:'IBM Plex Mono', monospace; font-size:19px; color:var(--brass); flex-shrink:0; width:26px;}
  .plan-fields{display:grid; grid-template-columns:1fr 1fr; gap:10px 22px; margin-top:12px;}
  .plan-fields .f{font-size:12.5px;}
  .plan-fields .f .k{font-size:9.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); margin-bottom:3px;}
  .plan-fields .f.wide{grid-column:1 / -1;}
  @media (max-width:640px){.plan-fields{grid-template-columns:1fr;}}

  /* Reports */
  .report-preview{background:var(--paper-raised); border:1px solid var(--line); border-radius:4px; padding:22px 26px; font-size:12.5px; line-height:1.7; white-space:pre-wrap; font-family:'IBM Plex Mono', monospace; max-height:480px; overflow-y:auto; margin-top:16px;}

  .legal-footer{margin-top:50px; padding-top:18px; border-top:1px solid var(--line); font-size:11px; color:var(--ink-faint); line-height:1.6; max-width:700px;}
  .empty-note{font-size:13px; color:var(--ink-faint); font-style:italic; padding:18px 0;}
  .settings-row{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .settings-row .k{color:var(--ink-faint); font-size:11.5px; text-transform:uppercase; letter-spacing:0.04em;}
  .review-section{margin-bottom:18px;}
  .review-section-title{font-family:'IBM Plex Mono', monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); margin-bottom:8px;}
  .history-card{background:var(--paper-raised); border:1px solid var(--line); border-radius:4px; padding:16px 20px; margin-bottom:12px;}
  .history-head{display:flex; justify-content:space-between; align-items:center;}
  .history-readiness{font-family:'Fraunces', serif; font-size:24px; color:var(--brass-dark);}
  .change-detected-panel{background:var(--action-tint); border:1px solid var(--action); border-radius:4px; padding:18px 22px; margin-top:10px;}

  /* ---------- Print / PDF output ----------
     Only the Reports screen is meant to be printed. Hide app chrome (nav rail, action
     buttons, workflow step labels) and let the report content reflow across pages
     instead of clipping inside its on-screen scroll box. */
  @media print{
    .railnav{ display:none !important; }
    #app-shell{ display:block !important; }
    main{ max-width:none !important; padding:0 24px !important; }
    .btn-row{ display:none !important; }
    .eyebrow{ display:none !important; }
    .report-preview{
      max-height:none !important;
      overflow:visible !important;
      border:none !important;
      box-shadow:none !important;
      padding:0 !important;
      font-size:11px !important;
    }
  }
</style>
</head>
<body>
<div id="app-shell">
  <nav class="railnav">
    <div class="railnav-brand">
      <div class="mark">COMPLYRA</div>

const TODAY = (function(){ const d = new Date(); d.setHours(0,0,0,0); return d; })();

/* =========================================================
   PERSISTENCE LAYER — LOCAL PERSISTENCE — PROTOTYPE
   ---------------------------------------------------------
   Deliberately isolated from UI/business logic behind a small
   adapter (get/set/remove) so persistence internals can change
   without touching any screen or state-mutation code elsewhere
   in this file.
   This edition (the standalone/Gumroad distribution) runs as a
   plain double-clicked HTML file in the buyer's own browser — not
   inside Claude's Artifact panel — so it uses the browser's own
   localStorage, the standard mechanism for a distributed app to
   remember data between sessions on the same browser/device. If a
   Claude Artifact's window.storage API happens to be present (e.g.
   this file is opened inside Claude.ai), that's used first since it
   offers slightly stronger isolation; localStorage is the fallback
   that makes the promise "your data is here when you reopen this"
   actually true for a real buyer in a real browser. An in-memory
   object is the last-resort fallback if neither is available (e.g.
   some private-browsing modes) — in that case data will not survive
   a reload, and the app discloses this honestly rather than silently
   losing data without explanation.
   This is never presented to the user as cloud sync or multi-device
   sync — it is local to one browser, on one device, by design. Use
   Settings → Download Full Backup to move data between devices.
   ========================================================= */
const _memoryFallbackStore = {};
function _hasWorkingLocalStorage(){
  try{
    if(typeof localStorage === "undefined") return false;
    const k = "__complyra_probe__";
    localStorage.setItem(k, "1");
    localStorage.removeItem(k);
    return true;
  } catch(e){ return false; }
}
const StorageAdapter = {
  hasArtifactStorage: (typeof window !== "undefined" && !!window.storage),
  hasLocalStorage: _hasWorkingLocalStorage(),
  get available(){ return this.hasArtifactStorage || this.hasLocalStorage; },
  async get(key){
    if(this.hasArtifactStorage){
      try{ const result = await window.storage.get(key, false); return result ? JSON.parse(result.value) : null; }
      catch(e){ /* fall through to localStorage */ }
    }
    if(this.hasLocalStorage){
      try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
      catch(e){ return null; }
    }
    return (key in _memoryFallbackStore) ? _memoryFallbackStore[key] : null;
  },
  async set(key, value){
    if(this.hasArtifactStorage){
      try{ await window.storage.set(key, JSON.stringify(value), false); return true; }
      catch(e){ /* fall through to localStorage */ }
    }
    if(this.hasLocalStorage){
      try{ localStorage.setItem(key, JSON.stringify(value)); return true; }
      catch(e){ /* quota exceeded or blocked — fall through */ }
    }
    _memoryFallbackStore[key] = value; return true;
  },
  async remove(key){
    if(this.hasArtifactStorage){
      try{ await window.storage.delete(key, false); return true; }
      catch(e){ /* fall through */ }
    }
    if(this.hasLocalStorage){
      try{ localStorage.removeItem(key); return true; }
      catch(e){ /* fall through */ }
    }
    delete _memoryFallbackStore[key]; return true;
  }
};

/* ---------- Document Intelligence (simulated, no external API) ---------- */
function seededOffset(id, salt){
  let h=0; const s=id+salt;
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; }
  return h;
}
function addDays(base, days){ const d=new Date(base); d.setDate(d.getDate()+days); return d; }
function fmtDate(d){ if(!d) return null; return d.toISOString().slice(0,10); }

/* ---------- Calendar reminder export (.ics) ----------
   No backend, no email capture — a real calendar file the user's own
   device notifies them from. This is what actually brings someone back
   to reopen a one-time-purchase, offline product: their own calendar
   pings them, not us. */
function icsEscape(text){
  return String(text).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
}
function buildICS({title, dateStr, description}){
  const dt = dateStr.replace(/-/g,""); // YYYYMMDD
  const stamp = new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
  const uid = "complyra-" + dt + "-" + Math.random().toString(36).slice(2,10) + "@complyra";
  return [
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Complyra//Compliance Reminder//EN","CALSCALE:GREGORIAN",
    "BEGIN:VEVENT",
    "UID:"+uid,
    "DTSTAMP:"+stamp,
    "DTSTART;VALUE=DATE:"+dt,
    "SUMMARY:"+icsEscape(title),
    "DESCRIPTION:"+icsEscape(description),
    "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Reminder","TRIGGER:-P7D","END:VALARM",
    "END:VEVENT","END:VCALENDAR"
  ].join("\r\n");
}
function downloadICS(filename, content){
  const blob = new Blob([content], {type:"text/calendar;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Very light heuristic date-detector for optionally pasted document text.
// Slash dates are parsed explicitly rather than via `new Date(string)`, because the
// native parser rejects genuine DD/MM/YYYY dates (the standard format in the UK and
// India — two of this prototype's three markets) whenever the day exceeds 12.
// Returns {date, ambiguous} where `ambiguous` is true only when both day and month
// components are <=12, meaning the DD/MM default was a genuine guess, not a fact.
function parseSlashDate(str){
  const m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(!m) return null;
  let day = +m[1], month = +m[2], year = +m[3];
  if(year < 100) year += 2000;
  let ambiguous = false;
  if(day > 12 && month <= 12){ /* unambiguous DD/MM */ }
  else if(month > 12 && day <= 12){ const t = day; day = month; month = t; /* was MM/DD */ }
  else { ambiguous = true; /* both <=12: defaulting to DD/MM/YYYY, but it's a guess */ }
  const d = new Date(year, month - 1, day);
  if(isNaN(d.getTime()) || d.getMonth() !== month - 1) return null; // rejects e.g. 31/02
  return {date:d, ambiguous};
}
function detectDateInText(text){
  if(!text) return null;
  const slashMatch = text.match(/(\d{1,2}\/\d{1,2}\/\d{2,4})/);
  if(slashMatch){
    const parsed = parseSlashDate(slashMatch[1]);
    if(parsed) return parsed;
  }
  const patterns = [
    /(\d{4}-\d{2}-\d{2})/,
    /(\d{1,2}\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+\d{4})/i
  ];
  for(const p of patterns){
    const m = text.match(p);
    if(m){
      const parsed = new Date(m[1]);
      if(!isNaN(parsed.getTime())) return {date:parsed, ambiguous:false};
    }
  }
  return null;
}

const SCENARIOS = [
  {v:"valid", l:"Simulate: Valid & Current"},
  {v:"expiring", l:"Simulate: Expiring Soon"},
  {v:"expired", l:"Simulate: Expired"},
  {v:"mismatch", l:"Simulate: Mismatch"},
  {v:"incomplete", l:"Simulate: Incomplete"},
];

function runSimulatedExtraction(req, scenario, pastedText){
  const off = seededOffset(req.id, scenario);
  let issueDate=null, expiryDate=null, entityName="Business entity (as declared in profile)", note="";

  if(scenario==="valid"){
    expiryDate = addDays(TODAY, 180 + (off % 300));
    issueDate = addDays(expiryDate, -365);
  } else if(scenario==="expiring"){
    expiryDate = addDays(TODAY, 8 + (off % 50));
    issueDate = addDays(expiryDate, -365);
  } else if(scenario==="expired"){
    expiryDate = addDays(TODAY, -(5 + (off % 110)));
    issueDate = addDays(expiryDate, -365);
  } else if(scenario==="mismatch"){
    expiryDate = addDays(TODAY, 200 + (off % 200));
    issueDate = addDays(expiryDate, -365);
    entityName = "Entity name on document differs from declared business name";
    note = "mismatch";
  } else if(scenario==="incomplete"){
    expiryDate = null; issueDate = null;
    note = "incomplete";
  }

  let dateSource = "simulated";
  let dateAmbiguous = false;
  const pastedResult = detectDateInText(pastedText);
  if(pastedResult && scenario!=="incomplete"){
    expiryDate = pastedResult.date;
    dateAmbiguous = pastedResult.ambiguous;
    dateSource = dateAmbiguous ? "detected in pasted text (heuristic — ambiguous date, see note below)" : "detected in pasted text (heuristic)";
  }

  return {
    documentType: req.name,
    entityName,
    issuingAuthority: req.source,
    jurisdiction: levelLabel(req),
    licenceNumber: "SIM-" + req.id.toUpperCase().replace(/-/g,"") + "-" + scenario.slice(0,3).toUpperCase() + (off % 900),
    issueDate: fmtDate(issueDate),
    expiryDate: fmtDate(expiryDate),
    dateSource,
    dateAmbiguous,
    simulated:true,
  };
}

function determineDocStatus(scenario, extraction){
  if(scenario==="incomplete" || !extraction.expiryDate) return "INCOMPLETE";
  if(scenario==="mismatch") return "MISMATCH";
  const diffDays = Math.round((new Date(extraction.expiryDate) - TODAY) / 86400000);
  if(diffDays < 0) return "EXPIRED";
  if(diffDays <= 60) return "EXPIRING";
  return "MATCHED";
}

function systemMessage(status, req){
  switch(status){
    case "MATCHED": return req.confidence==="requires_verification"
      ? "Document appears to correspond to this requirement. Source confidence is marked for verification — confirm with the issuing authority."
      : "Document appears to correspond to this requirement.";
    case "EXPIRING": return "Expiry information places this within the next 60 days — timely renewal is recommended.";
    case "EXPIRED": return "Expiry information suggests this document may no longer be current. Verify status with the issuing authority before relying on it.";
    case "MISMATCH": return "Potential mismatch identified between the document and your declared business details. Additional supporting documentation may be required.";
    case "INCOMPLETE": return "Key fields could not be determined from the information provided. Additional supporting documentation may be required.";
    case "REQUIRES_REVIEW": return "Marked for manual review — status has not been established from a document.";
    default: return "";
  }
}

/* ---------- Gap classification ---------- */
function docEntryFor(reqId){ return state.documents[reqId] || null; }
function classifyGap(req){
  const entry = docEntryFor(req.id);
  const status = entry ? entry.status : "MISSING";
  if(status==="MATCHED") return req.confidence==="requires_verification" ? "UNVERIFIED" : null;
  if(status==="EXPIRED") return req.criticality==="critical" ? "CRITICAL GAP" : "EXPIRY RISK";
  if(status==="EXPIRING") return "EXPIRY RISK";
  if(status==="MISMATCH") return "POTENTIAL MISMATCH";
  if(status==="INCOMPLETE") return "DOCUMENT GAP";
  if(status==="REQUIRES_REVIEW") return "UNVERIFIED";
  // MISSING
  if(req.criticality==="critical") return "CRITICAL GAP";
  if(req.criticality==="action_required") return "ACTION REQUIRED";
  if(req.criticality==="upcoming") return "UPCOMING";
  return "INFORMATION GAP";
}
const GAP_WEIGHT = {"CRITICAL GAP":4,"POTENTIAL MISMATCH":3.5,"EXPIRY RISK":3,"ACTION REQUIRED":2.5,"DOCUMENT GAP":2,"UNVERIFIED":1.5,"UPCOMING":1,"INFORMATION GAP":0.5};
const GAP_DOT = {"CRITICAL GAP":"critical","ACTION REQUIRED":"action_required","EXPIRY RISK":"upcoming","UPCOMING":"upcoming","DOCUMENT GAP":"action_required","POTENTIAL MISMATCH":"mismatch","UNVERIFIED":"na","INFORMATION GAP":"na"};

function computeReadiness(){
  const reqs = matchedRequirements();
  if(reqs.length===0) return {pct:0};
  let score=0, total=0;
  reqs.forEach(r=>{
    const w = CRIT_WEIGHT[r.criticality];
    total += w;
    const gap = classifyGap(r);
    if(gap===null) score += w;
    else if(gap==="UNVERIFIED") score += w*0.75;
    else if(gap==="EXPIRY RISK") score += w*0.5;
  });
  return {pct: total? Math.round(100*score/total) : 0};
}
function dashboardMetrics(){
  const reqs = matchedRequirements();
  const counts = {};
  reqs.forEach(r=>{ const g = classifyGap(r); if(g) counts[g]=(counts[g]||0)+1; });
  return {
    total: reqs.length,
    criticalExposure: counts["CRITICAL GAP"]||0,
    actionRequired: counts["ACTION REQUIRED"]||0,
    unverified: counts["UNVERIFIED"]||0,
    upcomingRisk: (counts["UPCOMING"]||0) + (counts["EXPIRY RISK"]||0),
    documentGaps: counts["DOCUMENT GAP"]||0,
    mismatches: counts["POTENTIAL MISMATCH"]||0,
  };
}
function actionPlanItems(){
  return matchedRequirements()
    .map(r=>({r, gap:classifyGap(r)}))
    .filter(x=>x.gap!==null)
    .sort((a,b)=> GAP_WEIGHT[b.gap]-GAP_WEIGHT[a.gap]);
}

/* ---------- Calendar bucketing ---------- */
function calendarBuckets(){
  const buckets = {overdue:[], d7:[], d30:[], d90:[], future:[], nodate:[]};
  matchedRequirements().forEach(r=>{
    const entry = docEntryFor(r.id);
    if(r.renewal==="One-time") return; // no ongoing renewal to track
    const exp = entry && entry.extraction && entry.extraction.expiryDate ? new Date(entry.extraction.expiryDate) : null;
    if(!exp){ buckets.nodate.push({r, dateStr:null}); return; }
    const diff = Math.round((exp - TODAY)/86400000);
    const item = {r, dateStr:fmtDate(exp), diff};
    if(diff<0) buckets.overdue.push(item);
    else if(diff<=7) buckets.d7.push(item);
    else if(diff<=30) buckets.d30.push(item);
    else if(diff<=90) buckets.d90.push(item);
    else buckets.future.push(item);
  });
  return buckets;
}

function complianceHealth(){
  const m = dashboardMetrics();
  if(m.criticalExposure>0 || m.mismatches>0) return {level:"AT RISK", color:"var(--critical)", tint:"var(--critical-tint)"};
  if(m.actionRequired>0 || m.unverified>0 || m.documentGaps>0) return {level:"ATTENTION REQUIRED", color:"var(--action)", tint:"var(--action-tint)"};
  return {level:"HEALTHY", color:"var(--compliant)", tint:"var(--compliant-tint)"};
}

function latestReview(){ return state.reviews.length ? state.reviews[state.reviews.length-1] : null; }

function buildCurrentSnapshot(){
  const reqs = matchedRequirements();
  const items = actionPlanItems();
  return {
    date: fmtDate(TODAY),
    profile: { ...state.profile },
    requirementIds: reqs.map(r=>r.id),
    documents: JSON.parse(JSON.stringify(state.documents)),
    gaps: items.map(x=>({ id:x.r.id, gap:x.gap })),

  };
}

// Compares the current live state against a prior snapshot (usually the latest saved
// review). Returns a structured diff used by both the Home "what changed" preview
// (read-only, no snapshot saved) and the formal Run Compliance Review action (which
// saves a new snapshot). If prevSnapshot is null, this is the business's first review.
function diffAgainstSnapshot(prevSnapshot){
  const current = buildCurrentSnapshot();
  if(!prevSnapshot) return { firstReview:true, current };

  const prevGapIds = new Set(prevSnapshot.gaps.map(g=>g.id));
  const currGapIds = new Set(current.gaps.map(g=>g.id));
  const prevReqIds = new Set(prevSnapshot.requirementIds);
  const currReqIds = new Set(current.requirementIds);

  const newRequirements = current.requirementIds.filter(id=>!prevReqIds.has(id));
  const removedRequirements = prevSnapshot.requirementIds.filter(id=>!currReqIds.has(id));
  const resolvedGaps = prevSnapshot.gaps.filter(g=>!currGapIds.has(g.id) && currReqIds.has(g.id));
  const newGaps = current.gaps.filter(g=>!prevGapIds.has(g.id));
  const stillOpenGaps = current.gaps.filter(g=>prevGapIds.has(g.id));

  const profileChangedFields = [];
  ["country","industry","hasEmployees","employeeCount","revenueAboveThreshold"].forEach(f=>{
    if(prevSnapshot.profile[f] !== current.profile[f]) profileChangedFields.push(f);
  });

  let documentsChangedCount = 0;
  const allDocKeys = new Set([...Object.keys(prevSnapshot.documents||{}), ...Object.keys(current.documents||{})]);
  allDocKeys.forEach(k=>{
    const a = prevSnapshot.documents ? prevSnapshot.documents[k] : undefined;
    const b = current.documents ? current.documents[k] : undefined;
    if(JSON.stringify(a) !== JSON.stringify(b)) documentsChangedCount++;
  });

  const readinessDelta = current.readinessPct - prevSnapshot.readinessPct;
  const hasMaterialChange = newRequirements.length || removedRequirements.length || resolvedGaps.length ||
    newGaps.length || profileChangedFields.length || documentsChangedCount>0;

  return {
    firstReview:false, current, prevDate: prevSnapshot.date,
    newRequirements, removedRequirements, resolvedGaps, newGaps, stillOpenGaps,
    profileChangedFields, documentsChangedCount, readinessDelta, hasMaterialChange,
  };
}

function reqNameById(id){ const r = REQUIREMENTS.find(x=>x.id===id); return r ? r.name : id; }

// Formal review: saves a snapshot + diff to history, updates workspace review dates.
function runComplianceReview(){
  const prev = latestReview();
  const diff = diffAgainstSnapshot(prev ? prev.snapshot : null);
  const record = {
    id: "REV-" + String(state.reviews.length+1).padStart(3,"0"),
    date: fmtDate(TODAY),
    snapshot: diff.current,
    diff,
  };
  state.reviews.push(record);
  state.workspace.lastReviewDate = fmtDate(TODAY);
  state.workspace.nextRecommendedReviewDate = fmtDate(addDays(TODAY, 90));
  return record;
}

function renderTrendChart(){
  const reviews = state.reviews;
  if(reviews.length < 2) return ""; // need at least 2 points for a meaningful trend
  const W = 560, H = 140, PAD = 24;
  const pts = reviews.map(r => r.snapshot.readinessPct);
  const n = pts.length;
  const xStep = (W - PAD*2) / (n-1);
  const coords = pts.map((p,i) => {
    const x = PAD + i*xStep;
    const y = H - PAD - (p/100)*(H - PAD*2);
    return [x,y];
  });
  const pathD = coords.map(([x,y],i)=> (i===0?"M":"L") + x.toFixed(1) + "," + y.toFixed(1)).join(" ");
  const areaD = pathD + ` L${coords[n-1][0].toFixed(1)},${H-PAD} L${coords[0][0].toFixed(1)},${H-PAD} Z`;
  const dots = coords.map(([x,y],i)=> `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="var(--brass-dark)"><title>REV-${String(i+1).padStart(3,"0")}: ${pts[i]}%</title></circle>`).join("");
  const gridLines = [0,25,50,75,100].map(v=>{
    const y = H - PAD - (v/100)*(H - PAD*2);
    return `<line x1="${PAD}" y1="${y.toFixed(1)}" x2="${W-PAD}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="2" y="${(y+3).toFixed(1)}" font-size="9" fill="var(--ink-faint)" font-family="IBM Plex Mono, monospace">${v}%</text>`;
  }).join("");
  return `
  <div class="trend-chart-wrap">
    <div class="label" style="margin-bottom:10px;">Readiness Trend — ${n} review${n===1?"":"s"}</div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; max-height:160px;">
      ${gridLines}
      <path d="${areaD}" fill="var(--brass-tint)" opacity="0.5"/>
      <path d="${pathD}" fill="none" stroke="var(--brass-dark)" stroke-width="2"/>
      ${dots}
    </svg>
  </div>`;
}

function renderChangePreview(preview){
  if(preview.firstReview){
    return `<div class="empty-note">No review yet — run your first Compliance Review to establish a baseline you can compare future visits against.</div>`;
  }
  if(!preview.hasMaterialChange){
    return `<div class="empty-note">No material changes detected since your last review (${preview.prevDate}).</div>`;
  }
  let rows = "";
  if(preview.newRequirements.length) rows += `<div class="change-row"><span class="tag outline">NEW REQUIREMENT</span> ${preview.newRequirements.map(reqNameById).join(", ")}</div>`;
  if(preview.newGaps.length) rows += `<div class="change-row"><span class="tag action_required">NEW GAP</span> ${preview.newGaps.map(g=>reqNameById(g.id)).join(", ")}</div>`;
  if(preview.resolvedGaps.length) rows += `<div class="change-row"><span class="tag good_practice">RESOLVED</span> ${preview.resolvedGaps.map(g=>reqNameById(g.id)).join(", ")}</div>`;
  if(preview.profileChangedFields.length) rows += `<div class="change-row"><span class="tag outline">PROFILE CHANGED</span> ${preview.profileChangedFields.join(", ")}</div>`;
  if(preview.documentsChangedCount>0) rows += `<div class="change-row"><span class="tag outline">DOCUMENTS UPDATED</span> ${preview.documentsChangedCount} document(s) changed</div>`;
  rows += `<div class="change-row"><span class="tag outline">READINESS</span> ${preview.readinessDelta>0?"+":""}${preview.readinessDelta}% since last review (${preview.prevDate})</div>`;
  return rows;
}

function buildReportText(){
  const p = state.profile;
  const country = COUNTRIES.find(c=>c.id===p.country);
  const industry = INDUSTRIES.find(i=>i.id===p.industry);
  const {pct} = computeReadiness();
  const m = dashboardMetrics();
  const reqs = matchedRequirements();
  const items = actionPlanItems();
  const b = calendarBuckets();

  let out = "";
  out += "COMPLYRA — COMPLIANCE REPORT\n";
  out += "Know What's Required. Know What's Missing. Know What to Do.\n";
  out += "Generated: " + fmtDate(TODAY) + " (prototype / illustrative data)\n";
  out += "=".repeat(60) + "\n\n";

  out += "BUSINESS PROFILE\n" + "-".repeat(20) + "\n";
  out += "Country: " + country.name + " (" + country.shape + ")\n";
  out += "Industry: " + industry.name + "\n";
  out += "Employees: " + (p.hasEmployees==="yes" ? p.employeeCount : "None declared") + "\n";
  out += "Revenue above typical threshold: " + (p.revenueAboveThreshold==="yes"?"Yes":"No") + "\n\n";

  out += "COMPLIANCE READINESS (Complyra product assessment)\n" + "-".repeat(20) + "\n";
  out += "Readiness: " + pct + "%\n";
  out += "Critical Exposure: " + m.criticalExposure + "\n";
  out += "Action Required: " + m.actionRequired + "\n";
  out += "Unverified Requirements: " + m.unverified + "\n";
  out += "Upcoming / Expiry Risk: " + m.upcomingRisk + "\n";
  out += "Potential Mismatches: " + m.mismatches + "\n\n";

  out += "COMPLIANCE MAP — " + reqs.length + " REQUIREMENTS\n" + "-".repeat(20) + "\n";
  reqs.forEach(r=>{
    out += "\n[" + CRIT_LABEL[r.criticality].toUpperCase() + "] " + r.name + " (" + levelLabel(r) + ")\n";
    out += "  Why: " + whyApplies(r) + "\n";
    out += "  Source: " + r.source + " | Confidence: " + r.confidence.replace("_"," ") + " | Renewal: " + r.renewal + "\n";
  });

  out += "\n\nDOCUMENT STATUS\n" + "-".repeat(20) + "\n";
  reqs.forEach(r=>{
    const entry = docEntryFor(r.id);
    out += r.name + ": " + (entry ? entry.status.replace("_"," ") : "Missing") + "\n";
  });

  out += "\nPOTENTIAL GAPS\n" + "-".repeat(20) + "\n";
  items.forEach(x=>{ out += "[" + x.gap + "] " + x.r.name + " (" + levelLabel(x.r) + ")\n"; });
  if(items.length===0) out += "None identified.\n";

  out += "\nACTION PLAN (priority order)\n" + "-".repeat(20) + "\n";
  items.forEach((x,i)=>{
    out += "\n" + (i+1) + ". " + x.r.name + " [" + x.gap + "]\n";
    x.r.steps.forEach(s=> out += "   - " + s + "\n");
  });

  out += "\nCOMPLIANCE CALENDAR\n" + "-".repeat(20) + "\n";
  const calSection = (title, list)=>{ if(list.length===0) return ""; let s=title+":\n"; list.forEach(it=> s+= "  " + it.r.name + " — " + (it.dateStr||"No date established") + "\n"); return s+"\n"; };
  out += calSection("Overdue", b.overdue) + calSection("Due within 7 days", b.d7) + calSection("Due within 30 days", b.d30) + calSection("Due within 90 days", b.d90) + calSection("Future", b.future) + calSection("No date established", b.nodate);

  out += "\nVERIFICATION NOTES\n" + "-".repeat(20) + "\n";
  out += "All requirement content and document extraction in this report is illustrative/simulated prototype data. Verify all requirements, sources, and dates directly with the applicable authority before taking material action.\n\n";

  out += "DISCLAIMER\n" + "-".repeat(20) + "\n";
  out += "Complyra provides general compliance information and guided action planning. It does not replace advice from a qualified legal, tax, accounting, regulatory or other professional. Requirements can depend on jurisdiction, business activity, transaction date and specific facts. Verify applicable requirements before taking material action.\n";

  return out;
}

  <div class="field-hint" style="margin-top:10px; max-width:600px;">Editing your country or industry will refresh your compliance framework — any documents recorded under the old profile will be cleared, since requirements may differ.</div>
  `;
}

function screenReviews(){
  const reviews = state.reviews;
  const last = latestReview();
  return `
  <div class="eyebrow">Compliance Reviews</div>
  <h2>Run Compliance Review</h2>
  <p class="lede">A review compares your current business state against your previous review and produces a structured summary: what changed, what remains open, what's new, what was resolved, what's due, and what to do next.</p>
  <button class="btn" id="run-review-btn-main">Run Compliance Review →</button>

  ${last ? `
  <h3 style="margin-top:32px;">Latest Review — ${last.id} (${last.date})</h3>
  ${renderReviewDetail(last)}
  ` : `<div class="empty-note" style="margin-top:20px;">No reviews yet. Running your first review establishes a baseline for Complyra to compare future visits against.</div>`}
  `;
}

function renderReviewDetail(review){
  const d = review.diff;
  if(d.firstReview){
    return `<div class="empty-note">This was your first review — it establishes the baseline. Readiness at time of review: ${d.current.readinessPct}%.</div>`;
  }
  const section = (title, tagClass, list, renderItem)=>{
    if(!list || list.length===0) return `<div class="review-section"><div class="review-section-title">${title}</div><div class="empty-note" style="padding:8px 0;">None</div></div>`;
    return `<div class="review-section"><div class="review-section-title">${title}</div>${list.map(renderItem).join("")}</div>`;
  };
  return `
  <div class="score-note" style="margin-bottom:16px;">Compared against the previous review on ${d.prevDate}. Readiness moved ${d.readinessDelta>0?"+":""}${d.readinessDelta}% (now ${d.current.readinessPct}%).</div>
  ${section("What's New", "outline", d.newRequirements, id=>`<div class="gap-item"><span>${reqNameById(id)}</span><span class="status-label">New requirement</span></div>`)}
  ${section("What Was Resolved", "good_practice", d.resolvedGaps, g=>`<div class="gap-item"><span>${reqNameById(g.id)}</span><span class="status-label">Resolved</span></div>`)}
  ${section("What Remains Open", "action_required", d.stillOpenGaps, g=>`<div class="gap-item"><span>${reqNameById(g.id)}</span><span class="status-label">${g.gap}</span></div>`)}
  ${section("New Gaps", "critical", d.newGaps, g=>`<div class="gap-item"><span>${reqNameById(g.id)}</span><span class="status-label">${g.gap}</span></div>`)}
  ${d.profileChangedFields.length ? `<div class="review-section"><div class="review-section-title">Business Profile Changed</div><div class="gap-item"><span>${d.profileChangedFields.join(", ")}</span><span class="status-label"></span></div></div>` : ""}
  `;
}

function screenHistory(){
  const reviews = [...state.reviews].reverse();
  return `
  <div class="eyebrow">Review History</div>
  <h2>History</h2>
  <p class="lede">Every completed Compliance Review, saved as a snapshot you can look back on.</p>
  ${reviews.length===0 ? '<div class="empty-note">No reviews yet — run your first review from the Reviews screen.</div>' :
    reviews.map(rev=>`
    <div class="history-card">
      <div class="history-head">
        <div>
          <div class="req-name" style="font-size:16px;">${rev.id}</div>
          <div class="field-hint" style="margin-top:2px;">${rev.date}</div>
        </div>
        <div class="history-readiness">${rev.snapshot.readinessPct}%</div>
      </div>
      <div class="field-hint">${rev.snapshot.requirementIds.length} requirements tracked · ${rev.snapshot.gaps.length} open gap(s) at time of review</div>
    </div>`).join("")
  }
  `;
}

function screenSomethingChanged(){
  const selected = state.changeTypeSelected;
  const impactAreas = selected ? (CHANGE_IMPACT_MAP[selected]||[]) : [];
  return `
  <div class="eyebrow">Something Changed</div>
  <h2>What changed?</h2>
  <p class="lede">Tell Complyra about a change to your business, and it will flag which parts of your compliance profile may need a fresh look.</p>
  <div class="option-row" style="margin-bottom:18px;">
    ${CHANGE_TYPES.map(c=>`<button class="option-btn ${selected===c.v?"selected":""}" data-change-type="${c.v}">${c.l}</button>`).join("")}
  </div>
  <div class="qblock" style="border-bottom:none;">
    <label>Notes (optional)</label>
    <textarea id="change-note-input" class="text-input" style="min-height:60px; max-width:600px;" placeholder="Any detail that might help later...">${state.changeNote||""}</textarea>
  </div>
  ${selected ? `
  <div class="change-detected-panel">
    <div class="eyebrow" style="margin-bottom:8px;">Change Detected</div>
    <p style="font-size:13.5px; color:var(--ink-soft); margin:0 0 12px 0;">This business change may affect your compliance requirements.</p>
    <div class="req-block"><div class="label">Potential Areas Requiring Review</div><ul>${impactAreas.map(a=>`<li>${a}</li>`).join("")}</ul></div>
    <div class="field-hint" style="margin:10px 0 16px 0;">These are potential impact areas, not confirmed requirements — verify with the applicable authority or a qualified professional.</div>
    <button class="btn" id="log-change-btn">Log This Change &amp; Run Compliance Review →</button>
  </div>
  ` : ""}
  ${state.lastChangeResult ? `<div class="notice-banner" style="margin-top:20px;">Change logged (${state.lastChangeResult.id}, ${state.lastChangeResult.date}). A new Compliance Review has been run — see Reviews or History.</div>` : ""}
  `;
}

function screenReports(){
  const preview = buildReportText();
  return `
  <div class="eyebrow">Reports</div>
  <h2>Reports</h2>
  <p class="lede">A single exportable Compliance Report — business profile, compliance map, document status, gaps, action plan, calendar, and verification notes.</p>
  <div class="btn-row">
    <button class="btn" id="download-report">Download Compliance Report (.md)</button>
    <button class="btn secondary" id="print-report">Print / Save as PDF</button>
  </div>
  <div class="report-preview" id="report-preview">${preview}</div>
  `;
}

function screenSettings(){
  const persistenceLabel = StorageAdapter.hasLocalStorage
    ? "SAVED IN THIS BROWSER — persists on this device/browser across sessions. Not cloud-synced; switching devices or browsers starts fresh unless you use Download Full Backup below."
    : "SESSION ONLY — this browser doesn't support local storage (e.g. private/incognito mode in some browsers), so data will not survive closing this tab. Use Download Full Backup below before closing.";
  return `
  <div class="eyebrow">Settings</div>
  <h2>Settings</h2>
  <div class="settings-row"><div><div class="k">Data & Persistence</div>${persistenceLabel}</div></div>
  <div class="settings-row"><div><div class="k">Reviews Saved</div>${state.reviews.length}</div></div>
  <div class="settings-row"><div><div class="k">Business Changes Logged</div>${state.changes.length}</div></div>

  <h3 style="margin-top:26px;">Backup &amp; Transfer</h3>
  <p class="lede" style="margin-top:6px;">Moving to a new computer, switching browsers, or just want a safety copy? Download a complete backup of everything — your profile, documents, reviews, and change history — as a single file you can restore from later, on this device or any other.</p>
  <div class="btn-row">
    <button class="btn" id="download-backup-btn">⬇ Download Full Backup (.json)</button>
    <label class="btn secondary" for="restore-backup-input" style="cursor:pointer; display:inline-flex; align-items:center;">⬆ Restore From Backup</label>
    <input type="file" id="restore-backup-input" accept="application/json" style="display:none;">
  </div>
  <div class="field-hint" id="restore-status" style="margin-top:8px;"></div>

  <button class="btn secondary" id="reset-profile" style="margin-top:24px; border-color:var(--critical); color:var(--critical);">Reset business workspace &amp; start over</button>
  <div class="legal-footer">Resetting permanently clears your saved business profile, documents, reviews, and change history from this browser/device. This cannot be undone — download a backup first if you might want this data again.</div>
  <div class="notice-banner" style="margin-top:24px;">Complyra Pro (cloud sync across devices, automatic email reminders, multi-business support) is in development. If we release it, past buyers of this product will be notified via Gumroad's update system automatically — no signup needed.</div>
  `;
}

function render(){
  renderRail();
  const main = document.getElementById("main");
  const map = { welcome:screenWelcome, onboarding:screenOnboarding, home:screenHome, business:screenBusiness,
    map:screenMap, documents:screenDocuments, gap:screenGap, plan:screenPlan, calendar:screenCalendar,
    reviews:screenReviews, history:screenHistory, somethingChanged:screenSomethingChanged,
    reports:screenReports, settings:screenSettings };
  const banner = (state.isDemoMode && state.screen!=="welcome") ? demoBanner() : "";
  main.innerHTML = banner + map[state.screen]();
  bindScreenEvents();
  window.scrollTo({top:0});
}

function bindScreenEvents(){
  const byId = id => document.getElementById(id);
  if(byId("start-btn")) byId("start-btn").addEventListener("click", ()=>{ state.screen="onboarding"; render(); });
  if(byId("try-demo-btn")) byId("try-demo-btn").addEventListener("click", ()=>{ loadDemoData(); render(); });
  if(byId("exit-demo-btn")) byId("exit-demo-btn").addEventListener("click", ()=>{ exitDemoMode(true); render(); });

  document.querySelectorAll(".option-btn[data-group]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const g = btn.getAttribute("data-group"); const v = btn.getAttribute("data-val");
      const isProfileScopeChange = (g==="country" || g==="industry");
      const hadPriorValue = state.profile[g] !== null;
      const isActualChange = state.profile[g] !== v;
      const hadAnyDocuments = Object.keys(state.documents).length > 0;
      if(isProfileScopeChange && hadPriorValue && isActualChange){
        state.documents = {};
        state.openUpload = null;
        if(hadAnyDocuments){
          state.profileChangeNotice = "Your business profile changed. Previous document assessments for the old profile were cleared because compliance requirements may differ.";
        }
      }
      state.profile[g] = v;
      if(g==="hasEmployees" && v==="no") state.profile.employeeCount = null;
      render();
      persistAll();
    });
  });

  if(byId("business-name-input")){
    byId("business-name-input").addEventListener("change", (e)=>{
      state.workspace.businessName = e.target.value.trim() || null;
      persistAll();
    });
  }

  document.querySelectorAll("[data-note-for]").forEach(el=>{
    el.addEventListener("change", (e)=>{
      const reqId = el.getAttribute("data-note-for");
      const val = e.target.value;
      if(val.trim()) state.notes[reqId] = val;
      else delete state.notes[reqId];
      persistAll();
    });
  });

  if(byId("onboarding-continue")) byId("onboarding-continue").addEventListener("click", ()=>{
    if(!profileComplete()) return;
    if(state.isDemoMode){
      // Editing and saving the demo profile is a clear signal the user wants
      // this to become their real, persisted business from here on.
      state.isDemoMode = false;
      state.reviews = []; state.changes = []; // demo review history shouldn't carry over as if real
      state.workspace.createdAt = null; state.workspace.lastReviewDate = null; state.workspace.nextRecommendedReviewDate = null;
    }
    const nameEl = byId("business-name-input");
    if(nameEl) state.workspace.businessName = nameEl.value.trim() || null;
    const firstTime = !state.workspace.createdAt;
    if(firstTime) state.workspace.createdAt = fmtDate(TODAY);
    state.profileChangeNotice = null;
    state.screen = "map";
    render();
    persistAll();
  });
  if(byId("edit-business-btn")) byId("edit-business-btn").addEventListener("click", ()=>{ state.screen="onboarding"; render(); });
  if(byId("map-continue")) byId("map-continue").addEventListener("click", ()=>{ state.screen="documents"; render(); });

  document.querySelectorAll("[data-toggle-upload]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = btn.getAttribute("data-toggle-upload");
      state.openUpload = state.openUpload===id ? null : id;
      render();
    });
  });
  document.querySelectorAll("[data-clear-doc]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ delete state.documents[btn.getAttribute("data-clear-doc")]; render(); persistAll(); });
  });
  document.querySelectorAll("[data-mark-review]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = btn.getAttribute("data-mark-review");
      state.documents[id] = { status:"REQUIRES_REVIEW", extraction:null, scenario:null };
      state.openUpload = null;
      render();
      persistAll();
    });
  });
  document.querySelectorAll("[data-scenario]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const [reqId, scenario] = btn.getAttribute("data-scenario").split("|");
      const req = REQUIREMENTS.find(r=>r.id===reqId);
      const pasteEl = document.getElementById("paste-"+reqId);
      const pastedText = pasteEl ? pasteEl.value : "";
      const extraction = runSimulatedExtraction(req, scenario, pastedText);
      const status = determineDocStatus(scenario, extraction);
      state.documents[reqId] = { status, extraction, scenario };
      state.openUpload = null;
      render();
      persistAll();
    });
  });
  if(byId("doc-continue")) byId("doc-continue").addEventListener("click", ()=>{ state.screen="gap"; render(); });
  if(byId("gap-continue")) byId("gap-continue").addEventListener("click", ()=>{ state.screen="plan"; render(); });
  if(byId("plan-continue")) byId("plan-continue").addEventListener("click", ()=>{ state.screen="calendar"; render(); });
  if(byId("cal-continue")) byId("cal-continue").addEventListener("click", ()=>{ state.screen="home"; render(); });

  document.querySelectorAll("[data-view-req]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ state.screen="map"; render(); });
  });
  document.querySelectorAll("[data-update-doc]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.openUpload = btn.getAttribute("data-update-doc");
      state.screen = "documents";
      render();
    });
  });
  document.querySelectorAll("[data-ics-reminder]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const [reqId, dateStr] = btn.getAttribute("data-ics-reminder").split("|");
      const req = REQUIREMENTS.find(r=>r.id===reqId);
      const title = "Complyra: " + (req ? req.name : "Compliance renewal") + " — renewal due";
      const description = "Reopen Complyra to review this compliance item. " + (req ? req.why : "") + " (Generated by Complyra — verify current status before acting.)";
      const ics = buildICS({title, dateStr, description});
      downloadICS("complyra-reminder-" + reqId + ".ics", ics);
    });
  });
  if(byId("remind-next-review-btn")) byId("remind-next-review-btn").addEventListener("click", ()=>{
    const ics = buildICS({
      title: "Complyra: Compliance Review Due",
      dateStr: state.workspace.nextRecommendedReviewDate,
      description: "Reopen Complyra and run a Compliance Review to check for changes since your last review, upcoming renewals, and new action items."
    });
    downloadICS("complyra-review-reminder.ics", ics);
  });

  // Custom (user-added) calendar reminders
  if(byId("add-custom-reminder-btn")) byId("add-custom-reminder-btn").addEventListener("click", ()=>{
    const titleEl = byId("custom-reminder-title");
    const dateEl = byId("custom-reminder-date");
    const title = titleEl.value.trim();
    const dateStr = dateEl.value;
    if(!title || !dateStr) { window.alert("Please enter both a reminder name and a date."); return; }
    state.customReminders.push({ id: "custom-" + Date.now() + "-" + Math.random().toString(36).slice(2,8), title, dateStr });
    render();
    persistAll();
  });
  document.querySelectorAll("[data-ics-custom-reminder]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = btn.getAttribute("data-ics-custom-reminder");
      const reminder = state.customReminders.find(r=>r.id===id);
      if(!reminder) return;
      const ics = buildICS({ title: "Complyra: " + reminder.title, dateStr: reminder.dateStr, description: "Reminder added in Complyra: " + reminder.title });
      downloadICS("complyra-custom-reminder.ics", ics);
    });
  });
  document.querySelectorAll("[data-delete-custom-reminder]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = btn.getAttribute("data-delete-custom-reminder");
      state.customReminders = state.customReminders.filter(r=>r.id!==id);
      render();
      persistAll();
    });
  });

  // Home / Reviews: Run Compliance Review
  ["run-review-btn","run-review-btn-main"].forEach(id=>{
    if(byId(id)) byId(id).addEventListener("click", ()=>{
      runComplianceReview();
      state.screen = "reviews";
      render();
      persistAll();
    });
  });
  if(byId("something-changed-btn")) byId("something-changed-btn").addEventListener("click", ()=>{
    state.changeTypeSelected = null; state.changeNote = ""; state.lastChangeResult = null;
    state.screen = "somethingChanged"; render();
  });
  document.querySelectorAll("[data-change-type]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.changeTypeSelected = btn.getAttribute("data-change-type");
      state.lastChangeResult = null;
      render();
    });
  });
  if(byId("change-note-input")){
    byId("change-note-input").addEventListener("change", (e)=>{ state.changeNote = e.target.value; });
  }
  if(byId("log-change-btn")) byId("log-change-btn").addEventListener("click", ()=>{
    const noteEl = byId("change-note-input");
    const note = noteEl ? noteEl.value : state.changeNote;
    const record = logBusinessChange(state.changeTypeSelected, note);
    runComplianceReview();
    state.lastChangeResult = record;
    state.changeTypeSelected = null;
    state.changeNote = "";
    render();
    persistAll();
  });

  if(byId("download-report")) byId("download-report").addEventListener("click", ()=>{
    const text = buildReportText();
    const blob = new Blob([text], {type:"text/markdown"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "complyra-compliance-report.md";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
  if(byId("print-report")) byId("print-report").addEventListener("click", ()=>{ window.print(); });

  if(byId("reset-profile")) byId("reset-profile").addEventListener("click", async ()=>{
    const confirmed = window.confirm("This permanently clears your business profile, documents, reviews, and change history from this browser. Have you downloaded a backup if you might want this data again? Click OK to proceed with reset.");
    if(!confirmed) return;
    state.profile = { country:null, industry:null, hasEmployees:null, employeeCount:null, revenueAboveThreshold:null };
    state.documents = {}; state.openUpload = null; state.profileChangeNotice = null;
    state.workspace = { businessName:null, createdAt:null, lastReviewDate:null, nextRecommendedReviewDate:null };
    state.reviews = []; state.changes = []; state.changeTypeSelected = null; state.changeNote = ""; state.lastChangeResult = null;
    state.notes = {}; state.customReminders = [];
    state.isDemoMode = false;
    state.screen = "onboarding";
    render();
    await clearPersisted();
  });

  if(byId("download-backup-btn")) byId("download-backup-btn").addEventListener("click", ()=>{
    const backup = {
      complyraBackupVersion: 2,
      exportedAt: new Date().toISOString(),
      profile: state.profile, workspace: state.workspace, documents: state.documents,
      reviews: state.reviews, changes: state.changes, notes: state.notes, customReminders: state.customReminders,
    };
    const blob = new Blob([JSON.stringify(backup, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const dateSlug = new Date().toISOString().slice(0,10);
    a.href = url; a.download = "complyra-backup-" + dateSlug + ".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
  if(byId("restore-backup-input")) byId("restore-backup-input").addEventListener("change", async (e)=>{
    const file = e.target.files[0];
    const statusEl = byId("restore-status");
    if(!file) return;
    try{
      const text = await file.text();
      const backup = JSON.parse(text);
      if(!backup || typeof backup !== "object" || !("profile" in backup) || !("workspace" in backup)){
        statusEl.textContent = "This doesn't look like a valid Complyra backup file.";
        statusEl.style.color = "var(--critical)";
        return;
      }
      const hasExistingData = !state.isDemoMode && (profileComplete() || Object.keys(state.documents).length>0 || state.reviews.length>0);
      if(hasExistingData){
        const confirmed = window.confirm("Restoring will replace your current business profile, documents, reviews, and change history in this browser. Continue?");
        if(!confirmed) { e.target.value = ""; return; }
      }
      state.profile = backup.profile || state.profile;
      state.workspace = backup.workspace || state.workspace;
      state.documents = backup.documents || {};
      state.reviews = backup.reviews || [];
      state.changes = backup.changes || [];
      state.notes = backup.notes || {};
      state.customReminders = backup.customReminders || [];
      state.openUpload = null; state.profileChangeNotice = null;
      state.isDemoMode = false;
      await persistAll();
      statusEl.textContent = "Backup restored successfully.";
      statusEl.style.color = "var(--compliant)";
      state.screen = "home";
      render();
    } catch(err){
      statusEl.textContent = "Could not read that file — make sure it's a Complyra backup .json file.";
      statusEl.style.color = "var(--critical)";
    }
    e.target.value = "";
  });
}

/* =========================================================
   BOOT — loads any saved workspace before first render
   ========================================================= */
async function boot(){
  const [savedProfile, savedWorkspace, savedDocuments, savedReviews, savedChanges, savedNotes, savedCustomReminders] = await Promise.all([
    StorageAdapter.get(STORAGE_KEYS.profile),
    StorageAdapter.get(STORAGE_KEYS.workspace),
    StorageAdapter.get(STORAGE_KEYS.documents),
    StorageAdapter.get(STORAGE_KEYS.reviews),
    StorageAdapter.get(STORAGE_KEYS.changes),
    StorageAdapter.get(STORAGE_KEYS.notes),
    StorageAdapter.get(STORAGE_KEYS.customReminders),
  ]);
  if(savedProfile) state.profile = savedProfile;
  if(savedWorkspace) state.workspace = savedWorkspace;
  if(savedDocuments) state.documents = savedDocuments;
  if(savedReviews) state.reviews = savedReviews;
  if(savedChanges) state.changes = savedChanges;
  if(savedNotes) state.notes = savedNotes;
  if(savedCustomReminders) state.customReminders = savedCustomReminders;
  state.screen = workspaceExists() ? "home" : "welcome";
  render();
}
boot();
</script>
</body>
</html>
